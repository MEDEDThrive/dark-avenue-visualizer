<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Dark Avenue - Movie Simulator</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        .screen {
            width: 80%;
            max-width: 800px;
            height: 400px;
            border: 3px solid #ff3333;
            margin: 0 auto;
            background: radial-gradient(circle, #220000 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            position: relative;
        }
        .emergency-light {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 50px rgba(255,0,0,0.8);
            animation: pulse-red 1.5s infinite;
            pointer-events: none;
            display: none;
        }
        @keyframes pulse-red {
            0% { opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }
        .dialogue {
            font-size: 20px;
            margin-top: 20px;
            color: #ff9999;
            min-height: 60px;
        }
        .speaker {
            font-weight: bold;
            color: #00ffff;
        }
        button {
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ff3333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <h1>🎬 Dark Avenue: Movie Code Simulator</h1>
    
    <div class="screen" id="movieScreen">
        <div class="emergency-light" id="emergencyLight"></div>
        <h3 id="sceneTitle">Scene 1: Hospital Emergency Corridor</h3>
        <div class="dialogue" id="dialogueBox">Click 'Play Animation' to start the movie scene...</div>
    </div>

    <button onclick="startMovieScene()">▶ Play Animation</button>

    <script>
        const scriptData = [
            { speaker: "RAJU (Hero)", text: "(Tezi se bhagte huye) 'Nahi... is baar nahi! Main kuch galat nahi hone dunga!'" },
            { speaker: "DR. KARAN", text: "'Raju! Kahan the tum? Patient ki condition critical ho rahi hai!'" },
            { speaker: "RAJU", text: "'Dr. Karan... main kisi ki jaan jaane nahi deta, aur khaas kar is hospital ki deewaro ke beech toh bilkul nahi!'" },
            { speaker: "SYSTEM ALERT", text: "*(Dhamaka hota hai! Batti gul, emergency lights on! File par Aabha ka naam milta hai!)*" }
        ];

        let currentIndex = 0;

        function startMovieScene() {
            const dialogueBox = document.getElementById("dialogueBox");
            const emergencyLight = document.getElementById("emergencyLight");
            
            if (currentIndex === 3) {
                emergencyLight.style.display = "block";
            }

            if (currentIndex < scriptData.length) {
                dialogueBox.innerHTML = `<span class="speaker">${scriptData[currentIndex].speaker}:</span><br>${scriptData[currentIndex].text}`;
                currentIndex++;
            } else {
                dialogueBox.innerHTML = "<i>[Scene 1 Ends: To be continued in GitHub repository...]</i>";
                currentIndex = 0;
                emergencyLight.style.display = "none";
            }
        }
    </script>

</body>
</html>
