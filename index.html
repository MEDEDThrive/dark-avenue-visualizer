<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raju's Cartoon Animation Project</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px #ff3366;
        }
        .canvas-container {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 20px auto;
            border: 5px solid #ffcc00;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }
        canvas {
            background: linear-gradient(to bottom, #70c5ce, #ffffff);
            display: block;
        }
        .dialogue-bubble {
            margin-top: 15px;
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 20px;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid #ff3366;
            min-width: 300px;
        }
        button {
            margin-top: 15px;
            padding: 10px 25px;
            background-color: #ff3366;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.4);
        }
        button:hover {
            background-color: #e6004c;
        }
    </style>
</head>
<body>

    <h1>🎨 Coding Cartoon World</h1>
    <p>Directed & Created by Raju</p>

    <div class="canvas-container">
        <canvas id="cartoonCanvas" width="800" height="400"></canvas>
    </div>

    <div class="dialogue-bubble" id="cartoonDialogue">
        "Hello Raju! Chaliye cartoon animation shuru karte hain!"
    </div>
    
    <div>
        <button onclick="startCartoonAction()">▶ Play Cartoon Animation</button>
    </div>

    <script>
        const canvas = document.getElementById('cartoonCanvas');
        const ctx = canvas.getContext('2d');

        // Character variables
        let charX = 100;
        let charY = 250;
        let isMoving = false;
        let stepAngle = 0;

        // Background Cloud positions
        let cloud1X = 100;
        let cloud2X = 500;

        function drawScene() {
            // 1. Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Ground (Zameen)
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, 320, canvas.width, 80);

            // Path/Road
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(0, 340, canvas.width, 60);

            // 3. Draw Moving Clouds (Badal)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(cloud1X, 80, 30, 0, Math.PI * 2);
            ctx.arc(cloud1X + 25, 70, 40, 0, Math.PI * 2);
            ctx.arc(cloud1X + 50, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cloud2X, 120, 25, 0, Math.PI * 2);
            ctx.arc(cloud2X + 20, 110, 35, 0, Math.PI * 2);
            ctx.arc(cloud2X + 40, 120, 25, 0, Math.PI * 2);
            ctx.fill();

            // Move clouds slowly
            cloud1X += 0.5;
            cloud2X += 0.5;
            if (cloud1X > 900) cloud1X = -100;
            if (cloud2X > 900) cloud2X = -100;

            // 4. Draw Cartoon Character (Raju / Hero)
            // Head
            ctx.fillStyle = '#ffdbac'; // Skin tone
            ctx.beginPath();
            ctx.arc(charX, charY - 45, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // Hair (Stylish Cartoon Hair)
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(charX, charY - 60, 15, Math.PI, Math.PI * 2);
            ctx.fill();

            // Eyes & Smile
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(charX - 7, charY - 48, 3, 0, Math.PI * 2);
            ctx.arc(charX + 7, charY - 48, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(charX, charY - 42, 8, 0, Math.PI); // Smile
            ctx.stroke();

            // Body (Shirt - Blue)
            ctx.fillStyle = '#00bcd4';
            ctx.fillRect(charX - 12, charY - 23, 24, 35);
            ctx.strokeRect(charX - 12, charY - 23, 24, 35);

            // Legs (Walking Animation)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            let legOffset = isMoving ? Math.sin(stepAngle) * 10 : 0;
            
            // Left Leg
            ctx.beginPath();
            ctx.moveTo(charX - 6, charY + 12);
            ctx.lineTo(charX - 6 + legOffset, charY + 45);
            ctx.stroke();

            // Right Leg
            ctx.beginPath();
            ctx.moveTo(charX + 6, charY + 12);
            ctx.lineTo(charX + 6 - legOffset, charY + 45);
            ctx.stroke();

            // If moving, update position
            if (isMoving) {
                charX += 2;
                stepAngle += 0.15;
                if (charX > 700) {
                    charX = 100; // Loop back
                }
            }

            // Loop the animation frames
            requestAnimationFrame(drawScene);
        }

        // Start animation loop on load
        drawScene();

        // Button control for dialogue and movement
        let stage = 0;
        function startCartoonAction() {
            const dialogue = document.getElementById("cartoonDialogue");
            isMoving = true;

            if (stage === 0) {
                dialogue.innerText = "Raju: 'Hospital se lekar action tak, hamara cartoon sab dikhayega!'";
                stage = 1;
            } else if (stage === 1) {
                dialogue.innerText = "Aabha: 'Ye coding se bani animation kitni cool hai yaar!'";
                stage = 2;
            } else {
                dialogue.innerText = "Director Raju: 'Dark Avenue movie ka cartoon version loading...'";
                stage = 0;
            }
        }
    </script>

</body>
</html>
